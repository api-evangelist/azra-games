name: Azra Games
description: Azra Games is a mobile role-playing game studio founded in 2022 by Mark
  Otero and headquartered in Sacramento, California. The studio builds RPGs on its
  proprietary "RPG GameKit" technology, with its flagship title UnGodly, a dark
  sword-and-sorcery RPG. Azra Games is backed by a16z and Pantera Capital and was
  added to the API Evangelist network as a company profile. As a game studio it
  publishes a public website, news, careers, terms, and privacy pages but does not
  expose a public developer API, SDK, or documentation surface at this time.
